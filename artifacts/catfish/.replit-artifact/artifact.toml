kind = "mobile"
  previewPath = "/"
  title = "Catfish"
  version = "1.0.0"
  id = "artifacts/catfish"
  router = "expo-domain"

  [[integratedSkills]]
  name = "expo"
  version = "1.0.0"

  [[services]]
  ensurePreviewReachable = "/status"
  name = "expo"
  paths = [ "/" ]
  localPort = 8000

  [services.development]
  run = "pnpm --filter @workspace/catfish run dev"

  [services.production]
  build = [ "pnpm", "--filter", "@workspace/catfish", "run", "build" ]
  run = [ "pnpm", "--filter", "@workspace/catfish", "run", "serve" ]

  [services.env]
  PORT = "8000"
  BASE_PATH = "/"
